<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLB Pitch Environment V54</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#152039;--line:#2b3d60;--text:#e9f1ff;--muted:#a8bad8;--good:#60d394;--warn:#ffd166;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Segoe UI,Arial,sans-serif}header,main{max-width:1680px;margin:auto;padding:20px}header{max-width:none;background:linear-gradient(115deg,#0b1220,#1a3157);border-bottom:1px solid var(--line)}h1{margin:0 0 6px;font-size:25px}h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:11px}.metric{background:#101a2d;border:1px solid var(--line);border-radius:8px;padding:12px}.label{font-size:12px;color:var(--muted)}.value{font-size:21px;font-weight:700;margin-top:4px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}input,select{color:var(--text);background:#101a2d;border:1px solid var(--line);padding:7px;border-radius:6px}.wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:8px;border-bottom:1px solid #253552;text-align:left}th{position:sticky;top:0;background:#1b2a45;cursor:pointer}.group td{background:#253d61!important;font-weight:700}.badge{padding:2px 8px;border-radius:99px;font-weight:700;font-size:12px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.badge.good{background:#123d29}.badge.warn{background:#4b3918}.badge.bad{background:#4a1d27}.hidden{display:none}
</style></head><body><header><h1>MLB Daily Pitch Environment — V54</h1><div class="muted">Self-contained current-run snapshot · player-page Active Spin · roof evidence · ET/DST-aware environment</div></header><main>
<section class="panel"><h2>Run contract</h2><div id="summary" class="grid"></div></section>
<section class="panel"><h2>Game environments</h2><div class="controls"><select id="gameBranch"><option value="">All branches</option><option>OUTDOOR</option><option>ENCLOSED</option></select><input id="gameSearch" placeholder="Search game, venue, roof"></div><div id="games" class="wrap"></div></section>
<section class="panel"><h2>Pitch physics</h2><div class="controls"><select id="pitchBranch"><option value="">All branches</option><option>OUTDOOR</option><option>ENCLOSED</option></select><input id="pitchSearch" placeholder="Search pitcher, team, pitch"></div><div id="pitches" class="wrap"></div></section>
<section class="panel"><h2>Active Spin source audit</h2><div id="active" class="wrap"></div></section>
<section class="panel"><h2>Roof evidence</h2><div id="roof" class="wrap"></div><h2 style="margin-top:18px">Findings</h2><div id="findings" class="wrap"></div></section>
</main>
<!-- V54_RUN_DATA -->
<script>
'use strict';
const D=JSON.parse(document.querySelector('#v54-run-data').textContent),T=D.tables||{};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=(v,n=2)=>Number.isFinite(Number(v))?Number(v).toFixed(n):'—';
const C=v=>{const s=String(v||'').toUpperCase();return s.includes('FAIL')||s==='FATAL'||s==='ERROR'?'bad':s.includes('WARN')?'warn':'good'};
const B=v=>`<span class="badge ${C(v)}">${E(v||'N/A')}</span>`;
function draw(id,rows,cols,group){if(!rows.length){document.querySelector(id).innerHTML='<p class="muted" style="padding:10px">No rows for this current run.</p>';return}let h='<table><thead><tr>'+cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join('')+'</tr></thead><tbody>',last='';for(const r of rows){const g=group?group(r):'';if(group&&g!==last){last=g;h+=`<tr class="group"><td colspan="${cols.length}">${E(g)}</td></tr>`}h+='<tr>'+cols.map(c=>`<td>${c[2]?c[2](r[c[0]],r):E(r[c[0]]||'—')}</td>`).join('')+'</tr>'}h+='</tbody></table>';const el=document.querySelector(id);el.innerHTML=h;el.querySelectorAll('th').forEach(x=>x.onclick=()=>{const k=x.dataset.k;rows.sort((a,b)=>String(a[k]||'').localeCompare(String(b[k]||''),undefined,{numeric:true}));draw(id,rows,cols,group)})}
function summary(){const rs=D.run_status||{},bs=D.bundle_status||{},p=T.pitch_physics_environment||[],f=T.findings||[],a=T.active_spin_player_source_audit||[];const rate=p.length?100*p.filter(x=>x.active_spin_pct!==null&&x.active_spin_pct!=='').length/p.length:0;const items=[['Collector',B(rs.status)],['Bundle',B(bs.status)],['Requested date',E(rs.requested_date||'—')],['Games',E(rs.games||0)],['Pitch rows',E(p.length)],['Active Spin filled',N(rate,1)+'%'],['Active Spin audit rows',E(a.length)],['Fatal findings',`<span class="${f.some(x=>String(x.severity).toUpperCase()==='FATAL')?'bad':'good'}">${f.filter(x=>String(x.severity).toUpperCase()==='FATAL').length}</span>`]];document.querySelector('#summary').innerHTML=items.map(x=>`<div class="metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}
function games(){const b=document.querySelector('#gameBranch').value,q=document.querySelector('#gameSearch').value.toLowerCase(),r=(T.game_environment_audit||[]).filter(x=>(!b||x.branch===b)&&JSON.stringify(x).toLowerCase().includes(q));draw('#games',r,[['game_pk','Game'],['game_datetime_et','First pitch ET'],['venue_name','Venue'],['roof_state','Roof',B],['branch','Branch',B],['temperature_f','Temp °F',v=>N(v,1)],['relative_humidity_pct','Humidity %',v=>N(v,0)],['air_density_kg_m3','Density',v=>N(v,4)],['external_wind_direction_deg_from','Wind from °',v=>N(v,0)],['wind_out_to_cf_kmh','Out to CF km/h',v=>N(v,1)],['forecast_time_delta_minutes','Forecast gap min',v=>N(v,0)]],x=>`${x.game_pk} · ${x.venue_name}`)}
function pitches(){const b=document.querySelector('#pitchBranch').value,q=document.querySelector('#pitchSearch').value.toLowerCase(),r=(T.pitch_physics_environment||[]).filter(x=>(!b||x.branch===b)&&JSON.stringify(x).toLowerCase().includes(q));draw('#pitches',r,[['game_pk','Game'],['team','Team'],['pitcher_name','Pitcher'],['branch','Branch',B],['pitch_type','Pitch'],['usage_pct','Usage %',v=>N(v,1)],['release_speed','Velo',v=>N(v,1)],['release_spin_rate','Spin rpm',v=>N(v,0)],['active_spin_pct','Active Spin %',v=>N(v,1)],['active_spin_source','Source'],['delta_pfx_x_inches','ΔH',v=>N(v,2)],['delta_pfx_z_inches','ΔV',v=>N(v,2)],['carry_wind_adjustment_ft_400ft','Wind carry',v=>N(v,2)]],x=>`${x.game_pk} · ${x.pitcher_name} · ${x.branch}`)}
summary();games();pitches();draw('#active',T.active_spin_player_source_audit||[],[['pitcher_id','Pitcher ID'],['pitch_type','Pitch'],['pitch_name','Pitch name'],['active_spin_pct','Active Spin %',v=>N(v,1)],['hawkeye_measured','Hawkeye'],['movement_inferred','Movement inferred'],['status','Status',B],['error','Error']],x=>`${x.pitcher_id||'Unknown pitcher'} · ${x.season||'Unknown season'}`);draw('#roof',T.roof_evidence_audit||[],[['game_pk','Game'],['venue_name','Venue'],['source','Source'],['vote','Vote',B],['parser_status','Parser status'],['confidence','Confidence',v=>N(v,2)]],x=>x.game_pk||'Unknown game');draw('#findings',T.findings||[],[['severity','Severity',B],['code','Code'],['entity','Entity'],['message','Message'],['action','Action']]);document.querySelector('#gameBranch').onchange=games;document.querySelector('#gameSearch').oninput=games;document.querySelector('#pitchBranch').onchange=pitches;document.querySelector('#pitchSearch').oninput=pitches;
</script></body></html>
